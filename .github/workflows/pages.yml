name: Сборка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # сайт живёт в подпапке tema-mail.github.io/alex-krown/
      # публичный показ: магазин «Вариант 1», новая главная и концепты; копия Тильды не публикуется
      - run: npm run build
        env:
          PUBLIC_BASE: /alex-krown
          PUBLIC_SITE_URL: https://tema-mail.github.io
          TILDA_COPY: '0'
      # весь личный кабинет – за логином и паролем; без секретов шаг падает и открытая админка не публикуется
      - name: Закрыть админку логином и паролем
        run: node scripts/lock-admin.mjs
        env:
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
      - name: Убрать ресурсы копии Тильды из публикации
        run: rm -rf dist/_t dist/no-leads.js
      - name: Закрыть копию от поисковиков
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      - name: Запретить Jekyll обрабатывать сборку
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
